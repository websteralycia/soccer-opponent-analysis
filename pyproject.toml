[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opponent-analysis-dashboard"
version = "0.1.0"
description = "Wyscout team report extraction and Streamlit upload prototype"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["opponent_intelligence*"]

[tool.setuptools.package-data]
opponent_intelligence = ["resources/*.json", "resources/*.csv", "resources/spatial/*.png", "resources/spatial/display/*.png", "resources/*.css", "resources/identities/*.json", "resources/identities/*.md", "resources/identities/images/*.png", "resources/identities/images/*.jpg", "resources/identities/images/*.jpeg", "resources/identities/images/*.webp"]
